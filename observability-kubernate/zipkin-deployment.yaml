apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: observability
  labels:
    app: zipkin

spec:
  replicas: 1

  selector:
    matchLabels:
      app: zipkin

  template:
    metadata:
      labels:
        app: zipkin

    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:3.4
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 9411
              name: http

          env:
            - name: STORAGE_TYPE
              value: "mem"

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"