apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:

      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'user-service'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 10s
        static_configs:
          - targets:
              - 'user-service.user-service.svc.cluster.local:80'
            labels:
              application: 'user-service'

      - job_name: 'product-service'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 10s
        static_configs:
          - targets:
              - 'product-service.product-service.svc.cluster.local:80'
            labels:
              application: 'product-service'

      - job_name: 'order-service'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 10s
        static_configs:
          - targets:
              - 'order-service.order-service.svc.cluster.local:80'
            labels:
              application: 'order-service'

      - job_name: 'payment-service'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 10s
        static_configs:
          - targets:
              - 'payment-service.payment-service.svc.cluster.local:80'
            labels:
              application: 'payment-service'

      - job_name: 'delivery-service'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 10s
        static_configs:
          - targets:
              - 'delivery-service.delivery-service.svc.cluster.local:80'
            labels:
              application: 'delivery-service'